<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אסא-אור | דוח שירות</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body { font-family: Arial; margin:0; padding:0; }
.card { padding:15px; margin:10px; background:#fff; border-radius:10px; }
.btn { padding:12px; border:0; border-radius:8px; cursor:pointer; }
.btn-primary { background:#e91e8c; color:#fff; }
.btn-secondary { background:#1a237e; color:#fff; }

#pdfTemplate { position:fixed; left:0; top:0; opacity:0; width:794px; background:#fff; }

.sig-box { border:1px solid #ccc; height:140px; position:relative; }
canvas { width:100%; height:140px; }

</style>
</head>

<body>

<div class="card">
<h3>דוח שירות</h3>

<input id="clientName" placeholder="לקוח"><br><br>
<input id="docNum" placeholder="מספר דוח"><br><br>

<button class="btn btn-secondary" onclick="previewPDF()">תצוגה</button>
<button class="btn btn-primary" onclick="sendReport()">שליחה</button>
</div>

<div class="card sig-box">
<canvas id="sigCanvas"></canvas>
<div id="sigLabel" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#aaa;">חתום כאן</div>
<button onclick="clearSig()" style="position:absolute;top:5px;left:5px;">נקה</button>
</div>

<div id="pdfTemplate">
  <h2>דוח שירות</h2>
  <div>לקוח: <span id="pdf-client"></span></div>
  <div>מספר: <span id="pdf-doc"></span></div>
  <img id="pdf-sig" style="width:300px;height:100px;border-bottom:1px solid #000;">
</div>

<script>
const SCRIPT_URL = "YOUR_WEBAPP_URL";

let canvas = document.getElementById("sigCanvas");
let ctx = canvas.getContext("2d");
let signing=false;
let points=[];

function resize(){
  const r = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio||2;
  canvas.width=r.width*dpr;
  canvas.height=140*dpr;
  canvas.style.width=r.width+"px";
  canvas.style.height="140px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();

function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}

canvas.onmousedown=e=>{
  signing=true;
  points.push([]);
  const p=pos(e);
  points[points.length-1].push(p);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
  document.getElementById("sigLabel").style.display="none";
};

canvas.onmousemove=e=>{
  if(!signing)return;
  const p=pos(e);
  points[points.length-1].push(p);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
};

canvas.onmouseup=()=>signing=false;
canvas.onmouseleave=()=>signing=false;

canvas.ontouchstart=canvas.onmousedown;
canvas.ontouchmove=canvas.onmousemove;
canvas.ontouchend=canvas.onmouseup;

function clearSig(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  points=[];
  document.getElementById("sigLabel").style.display="block";
}

function getSVG(){
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">`;
  points.forEach(s=>{
    if(s.length<2)return;
    let p=`M ${s[0].x} ${s[0].y}`;
    for(let i=1;i<s.length;i++)p+=` L ${s[i].x} ${s[i].y}`;
    svg+=`<path d="${p}" stroke="black" fill="none" stroke-width="2"/>`;
  });
  return svg+"</svg>";
}

async function makePDF(){
  document.getElementById("pdf-client").innerText=document.getElementById("clientName").value;
  document.getElementById("pdf-doc").innerText=document.getElementById("docNum").value;

  const svg=getSVG();
  const blob=new Blob([svg],{type:"image/svg+xml"});
  document.getElementById("pdf-sig").src=URL.createObjectURL(blob);

  await new Promise(r=>setTimeout(r,300));

  const canvas=await html2canvas(document.getElementById("pdfTemplate"),{scale:3});
  const img=canvas.toDataURL("image/png");

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF("p","mm","a4");

  const w=pdf.internal.pageSize.getWidth();
  const h=(canvas.height*w)/canvas.width;

  pdf.addImage(img,"PNG",0,0,w,h);

  return pdf.output("blob");
}

async function previewPDF(){
  const blob=await makePDF();
  window.open(URL.createObjectURL(blob));
}

async function sendReport(){
  const blob=await makePDF();

  const file=new File([blob],"report.pdf",{type:"application/pdf"});

  if(navigator.canShare?.({files:[file]})){
    await navigator.share({
      title:"דוח שירות",
      files:[file]
    });
  } else {
    window.open(URL.createObjectURL(blob));
  }
}
</script>

</body>
</html>
