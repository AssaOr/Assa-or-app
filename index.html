<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אסא-אור | דוח שירות</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body { font-family: Arial; margin:0; padding:0; direction:rtl; }
.app-header { padding:10px; background:#1a237e; color:white; display:flex; justify-content:space-between; align-items:center; }
.card { margin:10px; padding:10px; border:1px solid #ddd; border-radius:8px; }
input, select, textarea { width:100%; padding:6px; margin-top:5px; }
button { cursor:pointer; }
.sync-dot { width:10px; height:10px; border-radius:50%; background:#ccc; display:inline-block; }
.sync-dot.ok { background:green; }
.sync-dot.loading { background:orange; }
.sync-dot.err { background:red; }
</style>
</head>

<body>

<div class="app-header">
  <div>אסא-אור | דוח שירות</div>
  <div id="docNumber">מס׳ ...</div>
  <button onclick="openTechSettings()">👷</button>
</div>

<div class="card">
  <label>מספר מסמך</label>
  <input id="docNum">
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWJP2CwPg6ipfpIaG57i37WsGmIxO3iwUP6-KU8e1tNEjggrmtDHQH6OKyb9L7lNSE/exec';

let currentDocNum = null;

const pad = n => String(n).padStart(2,'0');
const now = new Date();

/* ========================
   תקשורת עם Apps Script
======================== */
async function sheetsGet(action){
  try {
    const r = await fetch(SCRIPT_URL + '?action=' + action);
    return await r.json();
  } catch (e) {
    console.error(e);
    return null;
  }
}

/* ========================
   מספר מסמך
======================== */
async function initDocNum() {
  try {
    const saved = localStorage.getItem('currentDocNum');

    if (saved) {
      currentDocNum = saved;
      document.getElementById('docNumber').textContent = 'מס׳ ' + saved;
      document.getElementById('docNum').value = saved;
      return;
    }

    const res = await sheetsGet('getNextDocNum');

    if (!res || !res.docNum) return;

    currentDocNum = res.docNum;

    document.getElementById('docNumber').textContent = 'מס׳ ' + res.docNum;
    document.getElementById('docNum').value = res.docNum;

    localStorage.setItem('currentDocNum', res.docNum);

  } catch (e) {
    console.error(e);
  }
}

/* ========================
   הגדרות טכנאי
======================== */
function openTechSettings() {
  const name = prompt('שם טכנאי:', localStorage.getItem('techName') || '');
  if (name === null) return;

  localStorage.setItem('techName', name);
  alert('נשמר בהצלחה');
}

/* ========================
   פונקציות בסיס
======================== */
function filterClients(){}

function calcHours(){}

/* ========================
   טעינה ראשית
======================== */
document.addEventListener('DOMContentLoaded', () => {
  initDocNum();

  document.getElementById('dateField') && (
    document.getElementById('dateField').value =
    now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate())
  );
});
</script>

</body>
</html>
