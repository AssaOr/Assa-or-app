<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>אסא-אור | דוח שירות</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#f5f7fa;margin:0}
.card{background:#fff;margin:12px;padding:12px;border-radius:10px}
input,button{padding:10px;width:100%;margin:5px 0;font-size:14px}
button{border:0;border-radius:8px;cursor:pointer}
.primary{background:#e91e8c;color:#fff}
.secondary{background:#1a237e;color:#fff}

#pdf{position:fixed;left:-9999px;top:-9999px;width:800px;background:#fff;padding:20px}

.sig{border:1px solid #ccc;height:140px;position:relative}
canvas{width:100%;height:140px}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#aaa}
</style>
</head>

<body>

<div class="card">
<h3>דוח שירות</h3>

<input id="clientName" placeholder="שם לקוח">
<input id="docNum" placeholder="מספר מסמך">

<button class="secondary" onclick="previewPDF()">תצוגה מקדימה</button>
<button class="primary" onclick="sendPDF()">שליחה</button>
</div>

<div class="card sig">
<canvas id="c"></canvas>
<div id="hint">חתום כאן</div>
<button onclick="clearSig()" style="position:absolute;top:5px;left:5px;width:auto">נקה</button>
</div>

<!-- PDF -->
<div id="pdf">
  <h2>דוח שירות</h2>
  <p>לקוח: <span id="p_client"></span></p>
  <p>מסמך: <span id="p_doc"></span></p>
  <img id="sigImg" style="width:300px;border-bottom:1px solid #000"/>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWJP2CwPg6ipfpIaG57i37WsGmIxO3iwUP6-KU8e1tNEjggrmtDHQH6OKyb9L7lNSE/exec";

/* ======================
   חתימה נקייה (SVG-based)
====================== */
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let drawing=false;
let strokes=[];

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr;
  canvas.height=140*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.onresize=resize;

function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}

canvas.onmousedown=e=>{
  drawing=true;
  strokes.push([]);
  const p=pos(e);
  strokes[strokes.length-1].push(p);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
  document.getElementById("hint").style.display="none";
};

canvas.onmousemove=e=>{
  if(!drawing)return;
  const p=pos(e);
  strokes[strokes.length-1].push(p);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
};

canvas.onmouseup=()=>drawing=false;
canvas.onmouseleave=()=>drawing=false;

canvas.ontouchstart=canvas.onmousedown;
canvas.ontouchmove=canvas.onmousemove;
canvas.ontouchend=canvas.onmouseup;

function clearSig(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  strokes=[];
  document.getElementById("hint").style.display="block";
}

function sigToImage(){
  const svg=`
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
    ${strokes.map(s=>{
      if(s.length<2)return "";
      let d=`M ${s[0].x} ${s[0].y}`;
      for(let i=1;i<s.length;i++) d+=` L ${s[i].x} ${s[i].y}`;
      return `<path d="${d}" stroke="black" fill="none" stroke-width="2"/>`;
    }).join("")}
  </svg>`;
  return "data:image/svg+xml;base64,"+btoa(svg);
}

/* ======================
   PDF
====================== */
async function buildPDF(){
  document.getElementById("p_client").innerText=document.getElementById("clientName").value;
  document.getElementById("p_doc").innerText=document.getElementById("docNum").value;

  document.getElementById("sigImg").src=sigToImage();

  await new Promise(r=>setTimeout(r,200));

  const el=document.getElementById("pdf");
  const canvas=await html2canvas(el,{scale:2});
  const img=canvas.toDataURL("image/png");

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF("p","mm","a4");

  const w=210;
  const h=(canvas.height*w)/canvas.width;

  pdf.addImage(img,"PNG",0,0,w,h);

  return pdf.output("blob");
}

/* ======================
   Preview
====================== */
async function previewPDF(){
  const blob=await buildPDF();
  window.open(URL.createObjectURL(blob));
}

/* ======================
   Share (mobile sheet)
====================== */
async function sendPDF(){
  const blob=await buildPDF();
  const file=new File([blob],"report.pdf",{type:"application/pdf"});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({
      title:"דוח שירות",
      files:[file]
    });
  } else {
    window.open(URL.createObjectURL(blob));
  }
}
</script>

</body>
</html>
